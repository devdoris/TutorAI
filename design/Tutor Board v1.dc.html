<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-54798a6b-4bb5-404d-bad0-3e603ae644d6/styles.css">
<script src="_ds/organic-54798a6b-4bb5-404d-bad0-3e603ae644d6/_ds_bundle.js"></script>
<style>
@keyframes tutor-nod { 0%,100% { transform: rotate(0deg) } 30% { transform: rotate(9deg) } 65% { transform: rotate(-4deg) } }
@keyframes tutor-jump { 0%,100% { transform: translateY(0) } 35% { transform: translateY(-26px) } 70% { transform: translateY(-6px) } }
@keyframes tutor-pulse { 0%,100% { opacity: .25 } 50% { opacity: .85 } }
@keyframes tutor-spark { 0% { opacity: 0; transform: scale(.4) } 40% { opacity: 1; transform: scale(1) } 100% { opacity: 0; transform: scale(1.5) } }
</style>
</helmet>
<div style="min-height: 100%; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); padding: 32px 28px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; align-items: center;">

  <div style="width: 100%; max-width: 1060px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span class="tag tag-accent-2" style="align-self: flex-start;">Teaching loop demo</span>
      <h1 style="font-family: var(--font-heading); font-size: 40px; line-height: 1.05; margin: 0;">The tutor at the board</h1>
      <p style="margin: 0; max-width: 46ch; font-size: 16px; color: var(--color-neutral-700); text-wrap: pretty;">Press an action and watch the tutor direct attention — point, trace, compare, listen, confirm, celebrate.</p>
    </div>
    <div class="card" style="padding: 14px 18px; min-width: 240px;">
      <div class="card-kicker">Tutor says</div>
      <div style="font-size: 17px; line-height: 1.35; min-height: 46px;">{{ caption }}</div>
    </div>
  </div>

  <div style="width: 100%; max-width: 1060px; background: var(--color-neutral-200); border-radius: var(--radius-lg); padding: 18px; box-sizing: border-box; box-shadow: var(--shadow-md);">
    <div style="position: relative; container-type: inline-size; width: 100%;">
    <svg viewBox="0 0 1000 620" style="width: 100%; height: auto; display: block; overflow: visible;">
      <rect x="236" y="26" width="740" height="460" rx="30" fill="var(--color-accent-700)"></rect>
      <rect x="252" y="42" width="708" height="428" rx="20" fill="#2c332d"></rect>

      <line x1="330" y1="336" x2="{{ traceX }}" y2="336" stroke="#eae2cf" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 12" opacity="{{ traceOpacity }}" style="transition: all .35s linear;"></line>

      <sc-for list="{{ digits }}" as="item" hint-placeholder-count="5">
        <g style="cursor: pointer;" onClick="{{ item.onPoint }}">
          <circle cx="{{ item.cx }}" cy="252" r="52" fill="{{ item.fill }}" stroke="{{ item.stroke }}" stroke-width="{{ item.sw }}" style="transition: all .3s ease;"></circle>
        </g>
      </sc-for>

      <g style="{{ figureStyle }}">
        <line x1="150" y1="498" x2="112" y2="588" stroke="var(--color-text)" stroke-width="9" stroke-linecap="round"></line>
        <line x1="150" y1="498" x2="192" y2="588" stroke="var(--color-text)" stroke-width="9" stroke-linecap="round"></line>
        <line x1="150" y1="378" x2="150" y2="500" stroke="var(--color-text)" stroke-width="10" stroke-linecap="round"></line>
        <polyline points="{{ leftArm }}" fill="none" stroke="var(--color-text)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="transition: all .45s cubic-bezier(.3,.8,.3,1);"></polyline>
        <polyline points="{{ rightArm }}" fill="none" stroke="var(--color-text)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="transition: all .45s cubic-bezier(.3,.8,.3,1);"></polyline>
        <g style="{{ headStyle }}">
          <circle cx="150" cy="332" r="38" fill="var(--color-bg)" stroke="var(--color-text)" stroke-width="9"></circle>
          <circle cx="137" cy="326" r="4.5" fill="var(--color-text)"></circle>
          <circle cx="163" cy="326" r="4.5" fill="var(--color-text)"></circle>
          <path d="{{ mouth }}" fill="none" stroke="var(--color-text)" stroke-width="5" stroke-linecap="round" style="transition: all .3s ease;"></path>
        </g>
        <sc-if value="{{ listening }}" hint-placeholder-val="{{ false }}">
          <g>
            <circle cx="150" cy="332" r="60" fill="none" stroke="var(--color-accent-2)" stroke-width="4" style="animation: tutor-pulse 1.4s ease-in-out infinite;"></circle>
            <text x="214" y="300" fill="var(--color-accent-700)" font-family="var(--font-heading)" font-size="44">?</text>
          </g>
        </sc-if>
        <sc-if value="{{ celebrating }}" hint-placeholder-val="{{ false }}">
          <g fill="var(--color-accent)" style="animation: tutor-spark 1.1s ease-out infinite;">
            <circle cx="72" cy="286" r="7"></circle>
            <circle cx="228" cy="268" r="9"></circle>
            <circle cx="120" cy="238" r="6"></circle>
          </g>
        </sc-if>
      </g>

      <line x1="{{ pointFromX }}" y1="{{ pointFromY }}" x2="{{ pointToX }}" y2="{{ pointToY }}" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12" opacity="{{ guideOpacity }}" style="transition: all .45s cubic-bezier(.3,.8,.3,1);"></line>
    </svg>

    <div style="position: absolute; inset: 0; pointer-events: none;">
      <div style="position: absolute; left: 29.2%; top: 11%; font-family: var(--font-heading); font-size: 3.4cqw; color: #f3ecdc;">{{ heading }}</div>
      <div style="position: absolute; left: 29.2%; top: 19.5%; font-size: 2cqw; letter-spacing: .08em; color: #cfd8c4;">{{ subheading }}</div>
      <div style="position: absolute; left: 29.2%; top: 68.5%; font-size: 2.4cqw; font-style: italic; color: #f3ecdc;">{{ written }}</div>

      <sc-for list="{{ digits }}" as="item" hint-placeholder-count="5">
        <div style="position: absolute; left: {{ item.leftPct }}; top: 40.6%; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1;" onClick="{{ item.onPoint }}">
          <span style="font-family: var(--font-heading); font-size: 5.2cqw; color: {{ item.ink }};">{{ item.d }}</span>
        </div>
        <div style="position: absolute; left: {{ item.leftPct }}; top: 57%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 0.5cqw; text-align: center; width: 13cqw;">
          <span style="font-size: 1.7cqw; letter-spacing: .06em; color: {{ item.labelInk }};">{{ item.label }}</span>
          <span style="font-size: 1.5cqw; color: #9fb08f;">{{ item.value }}</span>
        </div>
      </sc-for>
    </div>
    </div>
  </div>

  <div style="width: 100%; max-width: 1060px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
      <span style="font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-neutral-600); margin-right: 4px;">Point at</span>
      <sc-for list="{{ digits }}" as="item" hint-placeholder-count="5">
        <button class="btn btn-secondary" onClick="{{ item.onPoint }}" style="font-size: 15px;">{{ item.label }}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
      <span style="font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-neutral-600); margin-right: 4px;">Actions</span>
      <button class="btn btn-primary" onClick="{{ onTrace }}">Read the whole number</button>
      <button class="btn btn-primary" onClick="{{ onCompare }}">Compare two places</button>
      <button class="btn btn-secondary" onClick="{{ onWrite }}">Write on the board</button>
      <button class="btn btn-secondary" onClick="{{ onListen }}">Wait for a question</button>
      <button class="btn btn-secondary" onClick="{{ onNod }}">Nod</button>
      <button class="btn btn-secondary" onClick="{{ onCelebrate }}">Celebrate</button>
      <button class="btn btn-ghost" onClick="{{ onReset }}">Reset board</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;number&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;40632&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lesson&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Large whole numbers&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lesson&quot;},&quot;subheading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Every place is ten times the one on its right&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Lesson&quot;},&quot;showGuide&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}">
const PLACES = [
  { label: "Units", mult: 1 },
  { label: "Tens", mult: 10 },
  { label: "Hundreds", mult: 100 },
  { label: "Thousands", mult: 1000 },
  { label: "Ten thousands", mult: 10000 },
  { label: "Hundred thousands", mult: 100000 }
];
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

function under1000(n) {
  let out = "";
  if (n >= 100) { out += ONES[Math.floor(n / 100)] + " hundred"; n %= 100; if (n) out += " and "; }
  if (n >= 20) { out += TENS[Math.floor(n / 10)]; if (n % 10) out += "-" + ONES[n % 10]; }
  else if (n > 0) out += ONES[n];
  return out;
}
function words(n) {
  if (n === 0) return "zero";
  const th = Math.floor(n / 1000), rest = n % 1000;
  let out = "";
  if (th) out += under1000(th) + " thousand";
  if (th && rest) out += rest < 100 ? " and " : ", ";
  if (rest) out += under1000(rest);
  return out;
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function group(n) { return n.toLocaleString("en-US"); }

class Component extends DCLogic {
  state = { target: 2, mode: "idle", caption: "Here is our number. Tap any circle and I will point at it.", written: "", nod: 0, traceTo: 0, compare: null };
  timers = [];

  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; }
  componentWillUnmount() { this.clearTimers(); }
  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }

  digitsData() {
    const raw = String(this.props.number ?? "40632").replace(/\D/g, "").slice(0, 6) || "40632";
    const n = raw.length;
    const gap = n >= 6 ? 108 : 116;
    const startX = 612 - ((n - 1) * gap) / 2;
    return raw.split("").map((d, i) => {
      const place = PLACES[n - 1 - i];
      return { d, i, label: place.label, mult: place.mult, worth: Number(d) * place.mult, cx: startX + i * gap };
    });
  }

  point(i, caption) {
    this.clearTimers();
    const ds = this.digitsData();
    const item = ds[i];
    this.setState({
      target: i, mode: "point", compare: null,
      caption: caption || (item.worth === 0
        ? "This " + item.d + " holds the " + item.label.toLowerCase() + " place open — it is worth nothing on its own, but it keeps the other digits in place."
        : "The " + item.d + " sits in the " + item.label.toLowerCase() + " place, so it is worth " + group(item.worth) + ".")
    });
  }

  trace = () => {
    this.clearTimers();
    const ds = this.digitsData();
    const value = Number(ds.map(x => x.d).join(""));
    this.setState({ mode: "trace", compare: null, target: 0, traceTo: ds[ds.length - 1].cx + 62, caption: "Let us read it together, left to right." });
    ds.forEach((item, i) => this.later(120 + i * 520, () => this.setState({ target: i, caption: cap(words(item.worth || 0)) === "Zero" ? "Nothing in the " + item.label.toLowerCase() + "." : cap(words(item.worth)) + " …" })));
    this.later(140 + ds.length * 520, () => this.setState({ mode: "point", written: group(value) + " = " + cap(words(value)), caption: cap(words(value)) + "." }));
  };

  compare = () => {
    this.clearTimers();
    const ds = this.digitsData();
    const a = Math.max(0, Math.min(this.state.target, ds.length - 2));
    const b = a + 1;
    const ratio = ds[a].mult / ds[b].mult;
    this.setState({
      mode: "compare", compare: [a, b], target: a,
      caption: "Same digits, different places: one step to the left is worth " + ratio + " times more. " + ds[a].d + " here means " + group(ds[a].worth) + ", while " + ds[b].d + " there means " + group(ds[b].worth) + "."
    });
    [b, a, b, a].forEach((t, k) => this.later(700 + k * 700, () => this.setState({ target: t })));
  };

  write = () => {
    this.clearTimers();
    const ds = this.digitsData();
    const value = Number(ds.map(x => x.d).join(""));
    const text = group(value) + " = " + cap(words(value));
    this.setState({ mode: "write", compare: null, written: "", caption: "I will write it in words while you watch." });
    for (let k = 1; k <= text.length; k++) this.later(k * 45, () => this.setState({ written: text.slice(0, k) }));
  };

  listen = () => {
    this.clearTimers();
    this.setState({ mode: "listen", compare: null, caption: "I am listening — ask me anything about this number and we will come straight back here." });
  };

  nod = () => {
    this.clearTimers();
    this.setState({ mode: "nod", compare: null, nod: this.state.nod + 1, caption: "Yes — that is exactly it." });
    this.later(1100, () => this.setState({ mode: "point" }));
  };

  celebrate = () => {
    this.clearTimers();
    this.setState({ mode: "celebrate", compare: null, caption: "Well done! You read a whole number by its places." });
    this.later(2600, () => this.setState({ mode: "point" }));
  };

  reset = () => {
    this.clearTimers();
    this.setState({ target: 2, mode: "idle", written: "", compare: null, caption: "Fresh board. Tap a circle or pick an action." });
  };

  renderVals() {
    const st = this.state;
    const guide = this.props.showGuide ?? true;
    const ds = this.digitsData();
    const tIdx = Math.min(st.target, ds.length - 1);
    const t = ds[tIdx];
    const pointing = st.mode === "point" || st.mode === "trace" || st.mode === "compare" || st.mode === "write";

    const SX = 150, SY = 402;
    let rightArm = SX + "," + SY + " " + (SX + 46) + "," + (SY + 40) + " " + (SX + 58) + "," + (SY + 58);
    let leftArm = SX + "," + SY + " " + (SX - 46) + "," + (SY + 40) + " " + (SX - 58) + "," + (SY + 58);
    let handX = SX + 58, handY = SY + 58;

    if (pointing) {
      const ang = Math.atan2(252 - SY, t.cx - SX);
      const eAng = ang - 0.35;
      const ex = SX + 62 * Math.cos(eAng), ey = SY + 62 * Math.sin(eAng);
      handX = ex + 66 * Math.cos(ang); handY = ey + 66 * Math.sin(ang);
      rightArm = SX + "," + SY + " " + ex.toFixed(1) + "," + ey.toFixed(1) + " " + handX.toFixed(1) + "," + handY.toFixed(1);
    } else if (st.mode === "celebrate") {
      rightArm = SX + "," + SY + " " + (SX + 52) + "," + (SY - 34) + " " + (SX + 66) + "," + (SY - 82);
      leftArm = SX + "," + SY + " " + (SX - 52) + "," + (SY - 34) + " " + (SX - 66) + "," + (SY - 82);
    }

    const compare = st.compare || [];
    const digits = ds.map(item => {
      const isT = item.i === tIdx && pointing;
      const inCmp = compare.indexOf(item.i) >= 0;
      return {
        d: item.d, label: item.label, cx: item.cx, leftPct: (item.cx / 10).toFixed(2) + "%", value: item.worth ? group(item.worth) : "—",
        fill: isT ? "var(--color-accent)" : inCmp ? "#3c4a3d" : "rgba(243,236,220,0.07)",
        stroke: isT ? "#f3ecdc" : inCmp ? "var(--color-accent-2)" : "rgba(243,236,220,0.45)",
        sw: isT ? 5 : inCmp ? 4 : 2.5,
        ink: isT ? "#2c332d" : "#f3ecdc",
        labelInk: isT || inCmp ? "#eae2cf" : "#a9b79b",
        onPoint: () => this.point(item.i)
      };
    });

    return {
      digits,
      caption: st.caption,
      written: st.written,
      heading: this.props.heading ?? "Large whole numbers",
      subheading: this.props.subheading ?? "Every place is ten times the one on its right",
      leftArm, rightArm,
      mouth: st.mode === "celebrate" ? "M132 346 q18 18 36 0" : st.mode === "listen" ? "M136 348 q14 -6 28 0" : "M134 346 q16 10 32 0",
      headStyle: st.mode === "nod" ? "animation: tutor-nod 1s ease-in-out " + st.nod + "; transform-origin: 150px 370px;" : st.mode === "listen" ? "transform: rotate(-7deg); transform-origin: 150px 372px; transition: transform .4s ease;" : "transform: rotate(0deg); transform-origin: 150px 372px; transition: transform .4s ease;",
      figureStyle: st.mode === "celebrate" ? "animation: tutor-jump .9s ease-in-out infinite;" : "",
      listening: st.mode === "listen",
      celebrating: st.mode === "celebrate",
      traceX: st.mode === "trace" || st.written ? st.traceTo || ds[ds.length - 1].cx + 62 : 330,
      traceOpacity: st.mode === "trace" || st.written ? 0.6 : 0,
      guideOpacity: guide && pointing ? 0.9 : 0,
      pointFromX: handX, pointFromY: handY,
      pointToX: pointing ? t.cx - 56 : handX, pointToY: pointing ? 252 : handY,
      onTrace: this.trace, onCompare: this.compare, onWrite: this.write,
      onListen: this.listen, onNod: this.nod, onCelebrate: this.celebrate, onReset: this.reset
    };
  }
}
</script>
</body>
</html>
